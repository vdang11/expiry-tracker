
services:

  mysql:
    image: mysql:8
    container_name: expiry-mysql-dev
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: expiry_tracker
    volumes:
      - expiry_mysql_dev_data:/var/lib/mysql

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: expiry-backend-dev
    working_dir: /app
    restart: always

    volumes:
      - ./server:/app
      - ~/.m2:/root/.m2

    command: mvn spring-boot:run

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expiry_tracker?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Empty JWT_SECRET would override the dev default and block startup
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-0123456789abcdef}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025

    depends_on:
      - mysql
      - mailhog

  mailhog:
    image: mailhog/mailhog
    container_name: expiry-mailhog-dev
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    image: node:20
    container_name: expiry-frontend-dev
    working_dir: /app
    restart: always

    volumes:
      - ./client:/app

    command: sh -c "npm install && npm run dev"

    ports:
      - "5173:5173"

    environment:
      - VITE_API_URL=http://backend:8080

    depends_on:
      - backend

volumes:
  expiry_mysql_dev_data: