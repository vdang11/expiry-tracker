
services:

  mysql:
    image: mysql:8
    container_name: expiry-mysql-dev
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: expiry_tracker
    volumes:
      - expiry_mysql_dev_data:/var/lib/mysql

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: expiry-backend-dev
    working_dir: /app
    restart: always

    volumes:
      - ./server:/app
      - ~/.m2:/root/.m2

    command: mvn spring-boot:run

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expiry_tracker?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - mysql

  frontend:
    image: node:20
    container_name: expiry-frontend-dev
    working_dir: /app
    restart: always

    volumes:
      - ./client:/app

    command: sh -c "npm install && npm run dev"

    ports:
      - "5173:5173"

    environment:
      - VITE_API_URL=http://backend:8080

    depends_on:
      - backend

volumes:
  expiry_mysql_dev_data: