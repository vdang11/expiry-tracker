version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: expiry-mysql-dev
    restart: always
    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expiry_tracker
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    volumes:
      - mysql_expiry_dev_data:/var/lib/mysql

  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: expiry-backend-dev
    working_dir: /app

    volumes:
      - ./server:/app

    command: mvn spring-boot:run

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expiry_tracker?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      - mysql

  frontend:
    image: node:20
    container_name: expiry-frontend-dev
    working_dir: /app

    volumes:
      - ./client:/app
      - /app/node_modules

    command: sh -c "npm install && npm run dev -- --host"

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysql_expiry_dev_data: