version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: expiry-mysql-prod
    restart: always
    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: expiry_tracker
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    volumes:
      - expiry_tracker_mysql_prod_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    container_name: expiry-backend
    restart: always
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expiry_tracker?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: expiry-frontend
    restart: always
    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  expiry_tracker_mysql_prod_data:
    name: expiry_tracker_mysql_prod_data